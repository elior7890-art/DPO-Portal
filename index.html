<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מרשם — פורטל ניהול ציות</title>
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: var(--color-bg); }
  body, h1, h2, h3, h4, h5, h6, button, input, textarea, select, table {
    font-family: "Heebo", "Inter", system-ui, sans-serif;
  }
  h1, h2, h3, h4 { letter-spacing: 0; }
  a { color: var(--color-accent-300); text-decoration: none; }
  a:hover { color: var(--color-accent-200); text-decoration: underline; }
  ::selection { background: var(--color-accent-800); }
  #root { min-height: 100vh; background: var(--color-bg); color: var(--color-text); font-size: 15px; line-height: 1.6; }
</style>
</head>
<body>
<div id="root" dir="rtl"></div>
<script src="app.js"></script>
</body>
</html>
